name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Run tests first
        run: gradle --no-daemon clean test

      - name: Run benchmark
        run: gradle --no-daemon benchmark

      - name: Run JMH microbenchmarks
        run: gradle --no-daemon jmh

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-0.6.0
          path: |
            benchmark/results/benchmark-0.6.0.json
            benchmark/results/jmh-0.6.0.json
          if-no-files-found: error
